name: test

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
        include:
          - os: windows-latest
            php: '8.4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: php ./vendor/phpunit/phpunit/phpunit

  node:
    name: Node.js ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['14', '16', '18', '20', '22', '24']
        include:
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 開発用の esbuild と playwright は Node.js 18 以降が必要なので、インストールスクリプトを実行しない
      # (ブラウザのテストは browser ジョブで実行する)
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm test

  browser:
    name: Browsers (esbuild, Chromium, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium-headless-shell webkit
      - run: npm run test:browser
        env:
          LANGBANK_REQUIRE_BROWSERS: '1'
